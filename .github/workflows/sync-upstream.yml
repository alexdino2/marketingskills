name: Sync upstream

on:
  schedule:
    # Daily at 06:17 UTC
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork from upstream
        env:
          # GITHUB_TOKEN cannot merge upstream commits that touch
          # .github/workflows/* (needs OAuth `workflow` scope). Prefer a
          # fine-grained PAT secret with Contents + Workflows write.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          PARENT="$(gh api "repos/${REPOSITORY}" --jq '.parent.full_name')"
          if [ -z "$PARENT" ] || [ "$PARENT" = "null" ]; then
            echo "This repository is not a fork; nothing to sync."
            exit 1
          fi
          echo "Syncing ${REPOSITORY}:${BRANCH} from upstream ${PARENT}"
          if ! OUTPUT="$(gh repo sync "$REPOSITORY" --branch "$BRANCH" 2>&1)"; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "not accessible by personal access token"; then
              echo "::error::SYNC_TOKEN was refused. It needs access to ${REPOSITORY} with Contents: Read and write and Workflows: Read and write."
            elif [ "$HAS_SYNC_TOKEN" != "true" ] && echo "$OUTPUT" | grep -qiE "workflow|not accessible by integration"; then
              echo "::error::Upstream changed .github/workflows/, which GITHUB_TOKEN cannot write. Add a SYNC_TOKEN repo secret (fine-grained PAT with Contents: write and Workflows: write) or sync manually."
            elif echo "$OUTPUT" | grep -qiE "conflict|diverg|not possible to fast-forward|HTTP 409|HTTP 422"; then
              echo "::error::The fork has diverged from upstream and cannot be synced automatically. Merge upstream into a branch, open a PR and merge it with a merge commit (not squash)."
            fi
            exit 1
          fi
          echo "$OUTPUT"
